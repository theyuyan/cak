<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>cak</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#16171b;--fg:#c9ccd4;--dim:#6d717c;--acc:#8b97ff;--att:#f0b25a;--red:#ff7b6b;--ok:#7fd39a;--line:#2a2c33;--input:#1d1e24}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 "SF Mono",Menlo,Consolas,"Liberation Mono",monospace;display:flex;flex-direction:column}
header{padding:8px 16px;color:var(--dim);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow:auto;padding:12px 16px 4px}
.u{margin:14px 0 4px}.u b{color:var(--acc);font-weight:400;margin-right:6px}
.l{color:var(--dim);white-space:pre-wrap;margin-left:16px}.ok{color:var(--ok)}.bad{color:var(--red)}.att{color:var(--att)}
.ans{white-space:pre-wrap;margin:6px 0 2px 16px}.ans .cur{color:var(--acc);animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.tail{color:var(--dim);margin-left:16px}
.ap{margin:8px 0 8px 12px;padding:6px 10px;border-left:3px solid var(--att)}.ap.done{border-left-color:var(--line);color:var(--dim)}
.ap h4{margin:0 0 4px;font-weight:600;color:var(--att)}.ap.done h4{color:var(--dim)}.ap pre{margin:4px 0;color:var(--dim);white-space:pre-wrap}.ap pre .p{color:var(--ok)}.ap pre .m{color:var(--red)}
.ap .btns button{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 10px;margin-right:6px;font:inherit;cursor:pointer}.ap .btns button:hover{border-color:var(--att)}.ap .btns b{color:var(--att)}
footer{border-top:1px solid var(--line);padding:8px 16px 10px}
.row{display:flex;align-items:center;gap:8px}.row b{color:var(--acc);font-weight:400}
textarea{flex:1;background:var(--input);color:var(--fg);border:0;outline:0;resize:none;font:inherit;padding:6px 8px;border-radius:4px;height:36px}
.st{color:var(--dim);margin-top:6px;font-size:13px}
@media (prefers-reduced-motion:reduce){.ans .cur{animation:none}}
</style></head><body>
<header id="hd">cak · 连接中…</header>
<main id="m"></main>
<footer><div class="row"><b>›</b><textarea id="in" placeholder="输入…（Enter 提交 · Shift+Enter 换行 · /handles /status /quit）"></textarea></div><div class="st" id="st">空闲</div></footer>
<script>
const token = new URLSearchParams(location.hash.slice(1)).get('token'); const base = location.origin;
const $ = s => document.querySelector(s); const m = $('#m'), st = $('#st'), hd = $('#hd'), inp = $('#in');
let id = 1; const rpc = async (method, params = {}) => { const r = await fetch(base + '/rpc', { method: 'POST', headers: { 'content-type': 'application/json', 'x-cak-token': token }, body: JSON.stringify({ cak: '1', jsonrpc: '2.0', id: id++, method, params }) }); const j = await r.json(); if (j.error) throw new Error(j.error.message); return j.result; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const scroll = () => { m.scrollTop = m.scrollHeight; };
let ans = null, phase = 'idle', pendings = [], deltaOpen = false;
const setPhase = p => { phase = p; st.textContent = p === 'idle' ? `空闲 · ${status.ledgerSeq ?? '?'} 事件 · 常设 ${status.standingHandles ?? 0}` : p === 'thinking' ? '◌ 在想…' : p === 'tool' ? '⟳ 工具运行中' : '等你审批'; };
let status = {};
const fmt = e => { const p = e.payload || {}; if (e.type === 'invocation.requested') { const n = p.contract?.name; if (['model.generate','session.history','memory.search'].includes(n)) return; const a = p.args || {}; return { cls: 'l', text: `→ ${n} ${a.path ?? a.url ?? (a.argv ? a.argv.slice(0,3).join(' ') : '') ?? ''}` }; }
  if (e.type === 'invocation.denied') return { cls: 'l bad', text: `✗ ${p.code}: ${p.reason}` }; if (e.type === 'invocation.failed') return { cls: 'l bad', text: `✗ ${p.error?.code}: ${p.error?.message}` };
  if (e.type === 'invocation.executed' && p.output && typeof p.output === 'object') { const o = p.output; if ('exitCode' in o) return { cls: 'l', text: `← exit ${o.exitCode}` + (o.stdout ? '\n' + String(o.stdout).split('\n').slice(0,20).join('\n') : '') }; if ('replacements' in o) return { cls: 'l ok', text: `✔ 编辑 ${o.path}（替换 ${o.replacements} 处）` }; if ('created' in o) return { cls: 'l ok', text: `✔ 写入 ${o.path}` }; if ('installed' in o) return { cls: 'l ' + (o.installed ? 'ok' : 'bad'), text: `${o.installed ? '✔' : '✗'} 插件 ${o.id}：${o.message ?? ''}` }; if ('title' in o && 'elements' in o) return { cls: 'l', text: `← 浏览器「${o.title}」${o.url}` }; if ('status' in o && 'body' in o) return { cls: 'l', text: `← HTTP ${o.status} ${o.title ?? ''}` }; } };
const approval = t => { const box = el('div', 'ap'); box.append(el('h4', '', `需要审批  ${t.contract} ${t.args.path ?? t.args.url ?? (t.args.argv ? t.args.argv.slice(0,3).join(' ') : '') ?? ''}`)); if (t.diff) { const pre = el('pre'); t.diff.split('\n').slice(0,40).forEach(l => { const s = el('span', l.startsWith('+') ? 'p' : l.startsWith('-') ? 'm' : '', l + '\n'); pre.append(s); }); box.append(pre); } else box.append(el('pre', '', JSON.stringify(t.args).slice(0, 300)));
  const btns = el('div', 'btns'); const mk = (k, label, dec) => { const b = el('button'); b.innerHTML = `<b>${k}</b> ${label}`; b.onclick = async () => { try { const r = await rpc('session.decide', { approvalId: t.approvalId, decision: dec }); box.className = 'ap done'; btns.replaceWith(el('div', 'l', dec === 'grant' ? '已允许' : dec === 'deny' ? '已拒绝' : `常设：${r.standing?.human ?? ''}`)); pendings = pendings.filter(x => x !== t); if (!pendings.length) setPhase('thinking'); } catch (e) { alert(e.message); } }; return b; };
  btns.append(mk('y', '只批这次', 'grant'), mk('N', '拒绝', 'deny')); if (t.rule) btns.append(mk('s', t.rule.human + '（本会话不再问）', 'standing')); box.append(btns); return box; };
const es = new EventSource(base + '/events?since=9007199254740990&token=' + encodeURIComponent(token));
es.onmessage = ev => { const e = JSON.parse(ev.data);
  if (e.type === 'daemon.model.delta') { if (!ans) { ans = el('div', 'ans'); ans.append(el('span', 'txt', ''), el('span', 'cur', '▍')); m.append(ans); } ans.querySelector('.txt').textContent += e.payload.text; setPhase('thinking'); scroll(); return; }
  if (e.type === 'daemon.approval.needed') { pendings = e.payload.pending; for (const t of pendings) m.append(approval(t)); setPhase('approval'); scroll(); return; }
  if (e.type === 'daemon.task.result') { const out = typeof e.payload.output === 'string' ? e.payload.output : JSON.stringify(e.payload.output ?? e.payload.status); if (ans) { ans.querySelector('.cur')?.remove(); if (!ans.querySelector('.txt').textContent) ans.querySelector('.txt').textContent = out; ans = null; } else m.append(el('div', 'ans', out)); const u = e.payload.usage; m.append(el('div', 'tail', `· ${e.payload.status} · ${u?.calls ?? '?'} 次调用${u ? ` · ${(u.inputTokens/1000).toFixed(1)}k/${u.outputTokens} tok` : ''}${u?.cachedInputTokens ? ` · 缓存 ${u.cacheHitPct}%` : ''}`)); rpc('session.status').then(s => { status = s; setPhase('idle'); }); scroll(); return; }
  if (e.type === 'daemon.plugins.reloaded') { m.append(el('div', 'l ok', `✔ 已热加载插件：${e.payload.plugins.join(', ')}`)); return; }
  if (e.type === 'invocation.requested' && e.payload?.contract?.name === 'model.generate') { if (phase !== 'approval') setPhase('thinking'); if (ans && !ans.querySelector('.txt').textContent.endsWith('\n')) ans.querySelector('.txt').textContent += '\n'; return; }
  const l = fmt(e); if (!l) return; if (l.text.startsWith('→')) setPhase('tool'); m.append(el('div', l.cls, l.text)); scroll(); };
// 事件字段用 event: 名，浏览器 EventSource 需要按类型监听：这里统一走 message 需要 daemon 不设 event 名——所以再监听所有已知类型
['daemon.model.delta','daemon.approval.needed','daemon.task.result','daemon.plugins.reloaded','daemon.note','invocation.requested','invocation.executed','invocation.denied','invocation.failed'].forEach(t => es.addEventListener(t, ev => es.onmessage(ev)));
es.onerror = () => { hd.textContent = 'cak · 连接断开（daemon 停了？刷新重连）'; };
const submit = async () => { const v = inp.value.trim(); if (!v) return; inp.value = ''; if (v === '/quit') { window.close(); return; }
  if (v === '/status') { const s = await rpc('session.status'); m.append(el('div', 'l', JSON.stringify(s))); scroll(); return; }
  if (v === '/handles') { const hs = await rpc('session.handles'); for (const h of hs) { const row = el('div', 'l', `${h.id}  ${h.contract.name}  ${(h.caveats||[]).map(c => c.kind === 'requires-approval' ? '需审批' : c.kind === 'args.prefix' ? `${c.path}以${c.prefix}开头` : c.kind).join('；') || '无限制'}${h.expiresAt ? '  到期 ' + h.expiresAt.slice(11,16) : ''}`); if (h.expiresAt) { const x = el('button', '', '撤销'); x.style.cssText = 'margin-left:8px;font:inherit;background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:4px;cursor:pointer'; x.onclick = async () => { await rpc('session.revoke', { handleId: h.id }); row.textContent += '  已撤销'; }; row.append(x); } m.append(row); } scroll(); return; }
  const u = el('div', 'u'); u.append(el('b', '', '›'), el('span', '', v)); m.append(u); scroll(); setPhase('thinking'); try { await rpc('session.input', { text: v }); } catch (e) { m.append(el('div', 'l bad', '✗ ' + e.message)); setPhase('idle'); } };
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
document.addEventListener('keydown', e => { if (phase !== 'approval' || document.activeElement === inp && inp.value) return; const t = pendings[0]; if (!t) return; const k = e.key.toLowerCase(); const box = [...document.querySelectorAll('.ap:not(.done)')].pop(); if (!box) return; const btn = [...box.querySelectorAll('button')].find(b => b.textContent.trim().toLowerCase().startsWith(k)); if (btn) { e.preventDefault(); btn.click(); } });
rpc('session.status').then(s => { status = s; hd.textContent = `cak · ${s.workspace} · ${s.session} · ${s.backend}/${s.model} · ${s.plugins.length} 插件${s.mcp.length ? ' · MCP ' + s.mcp.length : ''}`; setPhase('idle'); inp.focus(); }).catch(e => { hd.textContent = 'cak · 无法连接：' + e.message + '（网址里的 token 对吗？）'; });
</script></body></html>
