id: G7
title: 双 Agent 握手（coordinator → minimal-file-agent，同进程双 Runtime）
specs:
  A: docs/design/08_AGENT_SPEC.example.yaml#1     # coordinator
  B: docs/design/08_AGENT_SPEC.example.yaml#0     # minimal-file-agent（名片 provides doc.summarize）
input: { user: "让 minimal-file-agent 总结 workspace/test.txt。" }
symbols: { $h.agent: "A.grants[0]", $h.fileB: "B.grants[0]" }
mockBackend:
  A:
    - { finishReason: tool_calls, toolCalls: [ { id: c1, handle: $h.agent, args: { target: minimal-file-agent, contract: { name: doc.summarize, version: "1.0.0" }, args: { path: "workspace/test.txt" } } } ] }
    - { finishReason: stop, content: "对方回复：摘要……" }
  B:
    - { finishReason: tool_calls, toolCalls: [ { id: b1, handle: $h.fileB, args: { path: "workspace/test.txt" } } ] }
    - { finishReason: stop, content: "摘要：……" }
strictSequenceA:
  - task.spawned
  - invocation.requested       # 上下文源 memory.search（上下文读取也是能力，同样入账）
  - invocation.authorized
  - invocation.executed
  - bundle.composed
  - invocation.requested
  - invocation.authorized
  - invocation.executed
  - invocation.requested        # agent.invoke
  - invocation.authorized
  - handle.attenuated           # A 为委派收窄（budget calls 20 → 子切片）
  - invocation.awaiting         # 异步等待 B 完成（async 契约）
  - task.step
  - task.suspended
  - task.resumed                # B 完成事件唤醒
  - invocation.executed         # 含 receiptRef
  - task.step
  - invocation.requested       # 上下文源 memory.search（上下文读取也是能力，同样入账）
  - invocation.authorized
  - invocation.executed
  - bundle.composed
  - invocation.requested
  - invocation.authorized
  - invocation.executed
  - task.step
  - task.finished
strictSequenceB:
  - handle.minted               # B 为来访者 A 铸窄句柄（doc.summarize，once）
  - task.spawned                # B 的任务，principal 链含 A
  - invocation.requested       # 上下文源 memory.search（上下文读取也是能力，同样入账）
  - invocation.authorized
  - invocation.executed
  - bundle.composed
  - invocation.requested
  - invocation.authorized
  - invocation.executed
  - invocation.requested        # file.read
  - invocation.authorized
  - invocation.executed
  - task.step
  - invocation.requested       # 上下文源 memory.search（上下文读取也是能力，同样入账）
  - invocation.authorized
  - invocation.executed
  - bundle.composed
  - invocation.requested
  - invocation.authorized
  - invocation.executed
  - task.step
  - task.finished
  - receipt.issued
expect:
  B.task.principalChain.contains: { kind: agent, id: coordinator }
  A.receiptVerifiesAgainstBLedger: true
  usageAgree: true               # A 记的 usage == B receipt 中 usage
  A.budgetRemaining.calls: 19
repeatable: true
