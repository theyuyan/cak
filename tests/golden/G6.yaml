id: G6
title: maxSteps=2 命中 → mustFinalize → Controller 只能 finish
spec: docs/design/08_AGENT_SPEC.example.yaml#0
task.maxSteps: 2
input: { user: "反复读文件直到我说停。" }
symbols: { $h.file: "grants[0]" }
mockBackend:
  script:
    - { finishReason: tool_calls, toolCalls: [ { id: c1, handle: $h.file, args: { path: "workspace/test.txt" } } ] }
    - { finishReason: tool_calls, toolCalls: [ { id: c2, handle: $h.file, args: { path: "workspace/test.txt" } } ] }   # step#1 里模型还想调工具
    - { finishReason: stop, content: "步数用尽，先汇报到此。" }                                                   # 收尾轮
strictSequence:
  - task.spawned
  - bundle.composed
  - invocation.requested
  - invocation.authorized
  - invocation.executed
  - invocation.requested
  - invocation.authorized
  - invocation.executed
  - task.step                   # step#0 continue
  - bundle.composed
  - invocation.requested
  - invocation.authorized
  - invocation.executed         # model #2 (mustFinalize=true 已在 TaskView.step)
  - invocation.requested        # Controller 仍尝试 file.read
  - invocation.denied           # STEP_LIMIT：mustFinalize 时禁止新的非 final 调用（模型调用除外，用于收尾）
  - bundle.composed
  - invocation.requested
  - invocation.authorized
  - invocation.executed         # model #3 收尾
  - task.step                   # finish
  - task.finished
expect:
  step1.mustFinalize: true
  denied: { code: STEP_LIMIT }
  taskStatus: finished
variant:
  controllerReturnsContinueOnMustFinalize: { expect: task.failed, code: STEP_LIMIT }
repeatable: true
